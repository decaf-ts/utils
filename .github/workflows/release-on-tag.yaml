name: "Release on Tag"

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '!*-no-ci'
  workflow_dispatch:

jobs:
  deploy:
    uses: decaf-ts/reusable-actions/.github/workflows/release-on-tag.yaml@master
    permissions:
      contents: write
      id-token: write
      packages: read
      pages: write
      security-events: write
    secrets: inherit
