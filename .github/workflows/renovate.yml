name: "Renovate"

on:
  repository_dispatch:
    types: [renovate-trigger, renovate-dep-trigger]
  workflow_dispatch:

jobs:
  # renovate-trigger (vuln found on PR): open security-update PRs by bumping
  # the dependency that brings in the offending library.
  renovate-security:
    name: Renovate security updates
    if: github.event.action != 'renovate-dep-trigger'
    uses: decaf-ts/reusable-actions/.github/workflows/renovate.yml@main
    with:
      pr-strategy: bump-dependents
      clear-stale-overrides: false
    secrets: inherit

  # renovate-dep-trigger (weekly dep pass): apply both remediation strategies
  # and clear overrides that no longer map to a known vulnerability.
  renovate-dep:
    name: Renovate weekly dep pass
    if: github.event.action == 'renovate-dep-trigger'
    uses: decaf-ts/reusable-actions/.github/workflows/renovate.yml@main
    with:
      pr-strategy: both
      clear-stale-overrides: true
    secrets: inherit
