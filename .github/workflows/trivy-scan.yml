name: "Trivy Security Scan"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'
  pull_request:
    branches: [master]

jobs:
  # On PR (and manual dispatch): vulnerabilities only. Fail the job when
  # HIGH/CRITICAL vulnerabilities with a known fix are found, and dispatch
  # renovate to open security-update PRs.
  trivy-vuln:
    name: Trivy vuln scan (PR)
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: decaf-ts/reusable-actions/.github/workflows/trivy-scan.yml@master
    with:
      scan-type: vuln
      severity: HIGH,CRITICAL
      exit-code: "1"
    secrets: inherit

  # Weekly schedule: dependency-update pass. Never fails; dispatches the weekly
  # renovate dep run that also clears no-longer-offending overrides.
  trivy-dep:
    name: Trivy dep pass (weekly)
    if: github.event_name == 'schedule'
    uses: decaf-ts/reusable-actions/.github/workflows/trivy-scan.yml@master
    with:
      scan-type: dep
    secrets: inherit
