name: "Run on PR Merge to Master"

on:
  pull_request:
    types:
      - closed

jobs:
  merge:
    if: github.event.pull_request.merged == true
    uses: decaf-ts/reusable-actions/.github/workflows/release-on-merge-pr.yml@master
    permissions:
      contents: write
      id-token: write
      packages: read
      pages: write
      security-events: write
    secrets: inherit
